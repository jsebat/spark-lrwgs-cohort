# Every threshold the module uses, versioned. The version string is written into every output row / summary
# so a result can always be traced to the rule set that produced it. Rationale for each value: DESIGN.md P#.
version: "0.3.0"          # 0.3.0 (2026-09-14): two-tier decision + rule layer (P15, JS); 0.2.0: observability/error allowance/mosaic floors on READABLE reads (P7)

orient:                      # P2
  min_sites: 20              # informative sites needed to orient a child block
  min_frac: 0.95             # majority fraction below which the block is AMBIGUOUS (MIXED_VOTES)
  small_min_sites: 10        # second tier (measured on the two quads, 2026-09-12): 10-19 votes orient only if unanimous;
  small_min_frac: 1.0        #   recovers ~2.6% of block bp per genome; ~50 small non-unanimous segments/genome stay AMBIGUOUS
  min_gq: 20                 # child and both parents; same value as 03_trio_phase_x.py
  max_splits: 3              # phase-switch errors located per block (0 = never split)
  split_min_sites: 2         # smallest isolated minority run that counts as a switch; a lone genotype error cannot split a block

transmission:                # P3
  xo_min_sites: 10           # informative sites required on EACH side of a within-block change point (crossover OR parental switch error;
                             #   the two are indistinguishable at the VCF level and are resolved by read support in M1b2)
  min_sites: 10              # informative sites needed to call a segment's transmitted haplotype
  min_frac: 0.95
  min_gq: 20
  max_splits: 6              # change points per parent block

xo_reads:                    # P3, M1b2 — crossover vs parental switch error from the parent's reads, by ALLELE CONCORDANCE
  min_spanning_reads: 3      # informative reads (bases at both flanking SNV hets support a haplotype) needed per gap
  crossover_max_disc: 0.2    # every gap informative and discordance <= this -> CROSSOVER (parent phasing intact)
  switch_min_disc: 0.8       # any informative gap with discordance >= this -> SWITCH_ERROR located at that gap
  min_mapq: 20               # (first version counted spanning reads only and passed ~150 "crossovers"/meiosis; see xo_reads.py)

hapdepth:                    # P7 input
  bin_size: 1000
  min_mapq: 20

candidates:                  # P5 — UNFILTERED ingestion; these are definitions of "candidate", not quality filters
  tr_min_units: 1            # child allele beyond both parents by >= this many motif units (unit = shortest motif)
  tr_min_bp: 1

hapmatrix:                   # P7
  k: [3, 5]                  # per-haplotype READABLE-read thresholds for "observed" (reads reporting REF or ALT at the site;
                             #   a read deleted / clipped / with a third base there counts towards depth, not observability);
                             #   k=5 is the working one at ~11x/hap
  error_reads: 1             # e = max(error_reads, error_frac * readable)
  error_frac: 0.05
  min_mapq: 20
  amb_flag_frac: 0.3         # AMBIGUOUS_READS flag when any of the six rows has > 30 % unreadable reads (dp >= 3); cohort 2026-09-13:
                             #   rule-only "phased germline" SNVs (paternal fraction 0.50 = noise) had a parental haplotype with 6/7 unreadable

phase_class:                 # P8 / P10
  min_alt_reads: 3           # evidence floor for germline/mosaic classes (first smoke run: single-read "germline" calls)
  germline_min_hap_frac: 0.8
  mosaic_max_hap_frac: 0.7
  mosaic_min_dp: 15
  mosaic_min_minority_reads: 3
  inherited_min_frac_on_T: 0.3

likelihood:                  # P9 — per-read false-alt rate, mis-tagging rate, per-candidate priors on the RAW set
  eps: 0.01                  # to be re-estimated per class from cohort hom-ref sites (reported with the results)
  delta: 0.03
  grid: 40
  prior:
    germline: 0.003          # ~70 true DNMs among ~32k raw small-variant candidates per child (§0.2)
    inherited: 0.10
    parental_mosaic: 0.0003  # transmitted parental mosaics ~5-10% of apparent DNMs (unverified); at ~10 reads on T a low-fraction
    child_mosaic: 0.0005     #   mosaic is nearly indistinguishable from germline, so this prior caps phase_score there (P10)
    artefact: 0.8962

final:                       # P15 - decision layer (M3), amended 2026-09-14 (JS): TWO TIERS + the original pipeline's rule layer AFTER the score.
  tau: {}                    #   tau / tau_rescue on rf_prob are legacy; the decision runs on rf_q (fold-quantile score) with tau_q below.
  tau_rescue: {}             #   While no score exists the decision runs in PROVISIONAL phase-only mode: YES iff germline_DNM_phased,
  phase_only_min_score: 0.9  #   hap_obs_k5 == 6, phase_score >= phase_only_min_score (rule ∩ posterior carried the PoO signal, 0.72 vs 0.50)
  require_hap_obs: 6
  tau_q:                     # TIER 1 (dnm_call YES): rf_q >= tau_q AND germline review class AND rules pass. rf_q = 1 - pass rate among the
    snv_indel: 0.99          #   fold's held-out real candidates of the same variant class. 0.99 = 1 % pass rate: 65 SNV + 8 indel per proband
    sv: 0.99                 #   outside the mask, paternal fraction 0.778 (= the original set's), exonic WES precision 1.00, recall 0.73 (2026-09-14).
                             #   SV sweep 2026-09-14 (mask as flag): 10 calls cohort-wide = 0.3 / proband, the expected de novo SV rate; paternal 0.75
    tr: 0.999                #   TR sweep 2026-09-14: 15 / proband, paternal 0.78, planted-germline recall 0.99, planted-inherited pass 0.11.
                             #   A key per variant class (SNV, INDEL, SV, TR) overrides the group key
  tau_q_tier2:               # TIER 2 (dnm_call CANDIDATE, reported for experimental validation): tau_q_tier2 <= rf_q < tau_q, same gate + rules.
    snv_indel: 0.95          #   107 per proband outside the mask (77 SNV + 30 indel), exonic recall 0.86, exonic FDR 0.08 (JS: "maybe ok for a 2nd tier")
    sv: 0.97                 #   59 cohort-wide = 1.7 / proband, paternal 0.72 (planted recall 0.81)
    tr: 0.997                #   37 / proband cumulative, paternal 0.69 (0.99 would be 106 / proband at 0.59 = noise)
  # LARGE-SV ROUTING (JS approved 2026-09-16). SVs at or above sv_large_min_svlen use their own threshold and their
  # own review-class gate; every SV below it keeps the genome-wide tau_q.sv of 0.99 and the genome-wide gate, unchanged.
  # Planted-deletion recall, genome-wide MODEL throughout -- no new classifier is used:
  #                                   5 kb    20 kb   50 kb
  #   production (gate, tau_q 0.99)   0.644   0.149   0.064
  #   tau 0.95 alone                  0.763   0.149   0.064    tau changes nothing above 5 kb
  #   tau 0.95 + widened gate         0.881   0.915   0.936    the gate is the whole effect
  # A dedicated >=5 kb classifier was trained and was WORSE (0.681 / 0.660 at 20 and 50 kb): restricting to >=5 kb
  # left 263 negatives against the genome-wide model's 22434. `inconclusive` is admitted because a large deletion's
  # signal is the ABSENCE of reads on the deleted haplotype, which the six-haplotype matrix cannot call phased-germline.
  sv_large_min_svlen: 5000
  sv_large_tau_q: null       # DISABLED (JS, 2026-09-16). One main classifier decides every SV on the genome-wide
                             # settings; large SVs are not re-thresholded here, they are routed to the targeted
                             # clinical arm (P31/P32) instead. The mechanism and the measurement above are kept so the
                             # decision is reversible and the reasoning is not lost.
  sv_large_rf_branch_classes: [germline_DNM_phased, germline_DNM_unphased, inconclusive]
  tau_q_rescue: 0.99         # legacy name of the pre-0.3.0 rescue branch; used as tier 2 only when tau_q_tier2 is absent
  tr_rescue_min_units: 3     # a TIER-2 TR call needs >= 3 motif units (one-haplotype stutter mimics a phased 1-unit change; cohort PoO 0.56 vs 0.75)
  rules:                     # rule layer, applied after the score to both tiers (JS 2026-09-14). These are rf_safe: false features (P24) -
    gnomad_af_max: 0.001     #   population frequency (absent from gnomAD = rare, as in the original pipeline's denovo_tier.py)
    catalog_af_max: 0.001    #   SV analogue: long-read SV population catalogue AF (lr_sv_catalog_af, RO >= 0.5); absent = rare
    founder_recurrence_max: 0  # leave-one-family-out founder-panel recurrence (P26)
    cohort_ac_max: 0         #   leave-one-family-out cohort allele count (P26); LOFO keeps sib-shared DNMs of a quad
    mask:                    #   the lab segdup / simple-repeat mask (10 % of the genome), from the features' segdup_overlap flag;
      default: true          #   per variant class: for SVs it is a FLAG only (92 % of SV candidates are repeat-borne; the original SV set
      SV: false              #   used founder-panel recurrence and read review, not the mask) - confirmed by JS 2026-09-14
  apply_rules: true
  sv_depth_rule_tier1: true   # an SV whose class was decided by the interval evidence (P8 amendment) with every germline
  sv_depth_min_rule_score: 6  #   criterion met is called on that evidence: the classifier has 43 positives between 10 and 50 kb
                              #   and 13 above it, so its score is uninformative there (it ranked the pathogenic MECP2 deletion
                              #   at 0.66 while the deterministic evidence scored it 6 of 6).
                             # the rf branch requires a germline-consistent review class (not inconclusive): PoO 0.46 for inconclusive rows

sv_interval:                 # P8 amendment 2026-09-14 (JS): a DELETION is classified on depth across the interval, not on
  del_max_ratio: 0.7         #   alt-read confinement. Child depth inside / flank at or below this = one haplotype lost (~0.5 expected).
  del_parent_min_ratio: 0.85 #   A parent at or above this is not depleted, so the event is not inherited from them.
  del_max_het_persistence: 0.35  # heterozygous sites inside / flanking rate; ~0 for a constitutional deletion, ~1 for mosaic/chimeric.
  flank_bp: 20000            # flank probes sit this far out, offset from the breakpoints by bp_window
  bp_window: 300
  probe_bp: 2000             # depth is the mean over points inside probe windows (a 15 kb read overlaps every short window)
  min_interval_bp: 300

qc_gates:                    # M1d — cohort values measured 2026-09-12 in brackets
  crossovers_per_meiosis: [15, 65]     # CROSSOVER excl. child-switch overlaps [F median 30 (18-53), M 43 (30-61)]; lower bound method
  min_frac_het_transmission_resolved: 0.90   # [0.962-0.988]
  min_total_depth: 12                  # autosome-averaged total depth per sample [median 23.1; three genomes 8.3-10.0 -> flagged, R11]
  min_tagged_frac: 0.75                # (hap1+hap2)/(hap1+hap2+untagged) [0.82-0.96]
  min_hap_balance: 0.90                # min/max of hap1, hap2 [0.99-1.00]
  max_frac_het_ambiguous: 0.10         # phased hets in AMBIGUOUS segments; het-weighted because bp-weighting is dominated by
                                       #   giant sparse blocks over pericentromeric het deserts (cohort 2026-09-12: bp 3.0-10.0%)
  max_frac_het_mixed_votes: 0.005      # the reason that signals a pedigree / phasing problem; het-weighted
  max_frac_bp_mixed_votes: 0.01        # same, bp-weighted, reported alongside [cohort median 0.0007, max 0.0092 = one 18 Mb 1q12 block]
  max_mendel_inconsistent_per_informative: 0.01   # [0.0006-0.0011]
