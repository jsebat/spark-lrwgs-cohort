[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-dnm"
version = "0.1.0"
description = "Phase-aware de novo mutation calling for long-read trios (spark-lrwgs-cohort module 13)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# Module 2 onwards; Module 1 is deliberately pure Python so it runs anywhere.
reads = ["pysam>=0.22", "cyvcf2>=0.30", "polars>=1.0", "numpy>=1.26"]
train = ["xgboost>=2", "scikit-learn>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
phase-dnm = "phase_dnm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
