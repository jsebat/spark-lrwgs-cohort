name: dnmt3a-r
channels: [conda-forge, bioconda, nodefaults]
dependencies:
  - r-base>=4.3
  - bioconductor-epidish
  - r-biocmanager
  - r-data.table
  - r-ggplot2
  - r-jsonlite
  # methylclock dependencies with compiled code (install from conda, not from source via BiocManager)
  - r-xml
  - r-xml2
  - r-rcurl
  - r-png
  - r-nloptr
  - r-systemfonts
  - r-fs
  - r-tidyverse
  - r-ggpubr
  - r-quadprog
  - r-rpmm
  - r-performanceanalytics
  - r-gridextra
  - r-devtools
  - bioconductor-minfi
  - bioconductor-impute
  - bioconductor-experimenthub
  - bioconductor-rhtslib
  - bioconductor-rhdf5lib
  - bioconductor-preprocesscore
  - bioconductor-planet
  # methylclock itself is not on bioconda; after creating the env run (or sbatch tools/r_env_fix.sbatch):
  #   Rscript -e 'BiocManager::install(c("methylclockData","methylclock"), ask=FALSE, update=FALSE)'
# Local dev box (Windows): R 4.6.1 at "C:/Program Files/R/R-4.6.1/bin/Rscript.exe"; EpiDISH/methylclock not installed there.
