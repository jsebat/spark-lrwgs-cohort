      sheet: dmrs.annot.summarized
      adapter: smith2021
      control_regex: 'NM|ND\.|sib'
      case_ids: ["154605", "624400", "894912"]
      kind: dmr
      chrom_col: chromosome
      start_col: start
      end_col: end
      build: hg38
      one_based: true
      delta_col: delta_beta

DNMT3A_GOF:
  sources:
    - name: heyn2019
      note: "HESJAS patient fibroblast RRBS, hypermethylated DMRs (Supp Table 2), hg19 BED; no effect size published"
      file: signatures/raw/DNMT3A_GOF/Heyn2019_NatGenet_41588_2018_274_MOESM3_ESM.txt
      header: null
      names: [chrom, start, end, name]
      kind: dmr
      chrom_col: chrom
      start_col: start
      end_col: end
      build: hg19
      one_based: false
      direction_fixed: 1
    - name: heyn2019
      note: "same study, hypomethylated DMRs (Supp Table 3)"
      file: signatures/raw/DNMT3A_GOF/Heyn2019_NatGenet_41588_2018_274_MOESM4_ESM.txt
      header: null
      names: [chrom, start, end, name]
      kind: dmr
      chrom_col: chrom
      start_col: start
      end_col: end
      build: hg19
      one_based: false
      direction_fixed: -1

DNMT1:
  sources:
    - name: arefeshghi2020
      note: "EpiSign v2 ADCADN probe set (104 probes)"
      file: signatures/raw/EPISIGN_SHARED/ArefEshghi2020_AJHG_mmc2.xlsx
      sheet: S2- Probes
      header: 1
      adapter: arefeshghi2020
      member_col: ADCADN
      means_sheet: S3-Methylation levels
      means_col: ADCADN
      kind: probe
      array: EPIC
      probe_col: Probes
      delta_col: delta_beta
    - name: kernohan2016
      note: "450K blood, ADCA-DN vs controls; 82 regions parsed from Additional file 1 PDF; Estimate = case-control difference"
      file: signatures/raw/DNMT1/Kernohan2016_ClinEpigenetics_AdditionalFile1_MOESM1.pdf
      adapter: pdf_regions
      regex: '^(?P<chrom>chr[0-9XY]+)\s+(?P<start>\d+)\s+(?P<end>\d+)\s+(?P<meth>[\d.]+)\s+(?P<nprobes>\d+)\s+(?P<estimate>-?[\d.]+)\s'
      expect_rows: 82
      kind: dmr
      chrom_col: chrom
      start_col: start
      end_col: end
      build: hg19
      one_based: true
      delta_col: estimate

