# Parsing spec for workflow/scripts/02_harmonize_signatures.py
# Every entry points at a file under signatures/raw/<ID>/ that is documented in that folder's SOURCE.md.
# Direction convention everywhere: delta = case minus control on the beta scale (negative = hypomethylated in cases).
# Sources sharing a `name` are treated as ONE source for tier counting (e.g. Jeffries probes + Jeffries DMRs).

TBRS_LOF:
  sources:
    - name: jeffries2019
      note: "450K, Amish DNMT3A R771Q (LOF-behaving missense) carriers vs WT relatives; limma DMPs (Table S1)"
      file: signatures/raw/TBRS_LOF/Jeffries2019_GenomeRes_gr.243584.118_Supplemental_Table_S1.xlsx
      sheet: Significant probes
      kind: probe
      array: HM450
      probe_col: TargetID
      delta_col: FC
    - name: jeffries2019
      note: "same cohort, DMRcate DMRs (Table S3), hg19 probe-to-probe spans"
      file: signatures/raw/TBRS_LOF/Jeffries2019_GenomeRes_gr.243584.118_Supplemental_Table_S3.xlsx
      sheet: DMRs
      kind: dmr
      coord_col: coord
      build: hg19
      one_based: true
      delta_col: meanbetafc
    - name: arefeshghi2020
      note: "EpiSign v2 TBRS probe set (139 probes); delta derived as S3 mean(TBRS) - mean(Control)"
      file: signatures/raw/TBRS_LOF/ArefEshghi2020_AJHG_mmc2.xlsx
      sheet: S2- Probes
      header: 1
      adapter: arefeshghi2020
      member_col: TBRS
      means_sheet: S3-Methylation levels
      means_col: TBRS
      kind: probe
      array: EPIC
      probe_col: Probes
      delta_col: delta_beta
    - name: smith2021_nonR882
      note: "WGBS blood, 8 non-R882 DOS patients vs 15 controls (metilene DMRs, Supp Data 2); hg38 1-based (verified: start = C of first CpG, end = G of last CpG)"
      file: signatures/raw/TBRS_LOF/Smith2021_NatCommun_41467_2021_24800_MOESM5_ESM.xlsx
      sheet: dmrs.annot.summarized
      adapter: smith2021
      control_regex: 'NM|ND\.|sib'
      case_ids: ["723972", "511909", "518693", "930075", "786396", "411168", "228211", "295041"]
      kind: dmr
      chrom_col: chromosome
      start_col: start
      end_col: end
      build: hg38
      one_based: true
      delta_col: delta_beta

DNMT3A_R882:
  sources:
    - name: smith2021_R882
      note: "WGBS blood, 3 R882H/C DOS patients vs 15 controls (Supp Data 1)"
